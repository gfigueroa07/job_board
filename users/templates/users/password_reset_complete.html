{% extends 'job_board/base.html' %}
{% load static %}

{% block title %}Password Updated | Hustlr{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            ✅
        </div>

        <h1>Password Updated</h1>

        <p class="subtitle">
            Your password has been successfully changed.
        </p>

        <a href="{% url 'login' %}" class="primary-link-button">
            Sign In
        </a>

    </div>

</div>

{% endblock %}
